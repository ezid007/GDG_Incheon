  <title id="title">가상 서점의 책 모양 간판</title>
  <desc id="desc">크림색 가게 앞에 진한 녹색 간판이 있다. 간판 한가운데에는 양쪽 페이지와 글줄을 알아볼 수 있는 노란색 펼친 책 표식이 크게 그려져 있다. 실제 장소가 아닌 관찰 게임용 예시 그림이다.</desc>
