  <title id="title">가상 쉼터의 오른쪽 화살표</title>
  <desc id="desc">나무와 벤치가 있는 가상 골목. 벤치 표식과 쉼터라는 글자가 있는 노란 안내판은 오른쪽 끝이 뾰족한 화살표 모양이다. 실제 위치나 이동 경로를 안내하는 지도가 아니다.</desc>
