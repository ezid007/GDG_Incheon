name: Deploy Golmok Detective

on:
  # Publishing is explicit; source pushes never republish the site.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone game
        run: node apps/golmok-detective/build.mjs
      - name: Test game and server
        run: node --test apps/golmok-detective/tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/golmok-detective/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
